<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Series</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div th:replace="topBar :: topBar"></div>


    <!-- Display Media Thumbnail Preview -->
    <div class="mediaUploadShowcase" >
        <div class="mediaUploadShowcaseDisplay">
            <img alt="what" class="mediaDisplayImage" id="displayImage">
            <h5 class="mediaDisplayText" id="mediaDisplayText">Series Title</h5>
        </div>
    </div>


    <!-- Create new series -->
    <div id="newSeriesMakerDiv" style="display: block">
        <h3>Create New Series</h3>
        <table class="movieInputTable">

            <!-- choose a series Thumbnail -->
            <tr>
                <td>
                    <h5>Choose a movie thumbnail</h5>
                </td>
                <td>
                    <div class="chooseImageFileDiv">
                        <input type="file" id="imageUpload" accept="image/png, image/jpeg">
                    </div>
                </td>
            </tr>

            <!-- choose a Title -->
            <tr>
                <td>
                    <h5>Enter Movie Title</h5>
                </td>
                <td>
                    <div class="titleInputDiv">
                        <!-- TODO make maxlength config dependant -->
                        <input type="text" maxlength="50" minlength="1" id="title">
                    </div>
                </td>
            </tr>

            <!-- choose a Genre -->
            <tr>
                <td>
                    <h5>Choose Genre</h5>
                </td>
                <td>
                    <div class="genreInputDiv">
                        <input type="text" id="genre">
                    </div>
                </td>
            </tr>

            <!-- Submit Button -->
            <tr>
                <td>
                </td>
                <td>
                    <input type="button" value="Submit" id="submit" disabled content="Submit">
                </td>
            </tr>
        </table>

    </div>
</body>
<script th:inline="javascript">

    const MAX_IMAGE_SIZE = 16777215; //TODO get from config


    let submitButtonElement = document.getElementById("submit")
    let imageElement = document.getElementById("imageUpload");
    let titleElement = document.getElementById("title");
    let genreElement = document.getElementById("genre");


    let imageFile = null;
    let title = null;
    let genre = null;


    // ------------------------------------- add event listeners---------------------------------------


    submitButtonElement.addEventListener("click", submitSeries);
    imageElement.addEventListener("change", checkImageReady);
    titleElement.addEventListener("input", checkTitleReady);
    genreElement.addEventListener("input", checkGenreReady);


    // ----------------------------------------- input checks -----------------------------------------

    function checkImageReady(){

        console.log(imageElement.files[0].size);
        if(imageElement.files[0].size > MAX_IMAGE_SIZE){
            imageFile = null;
            //TODO error
        }
        else {
            imageFile = imageElement.files[0];
            document.getElementById("displayImage").src = imageBytesToURL(imageFile);
        }
        checkAll();
    }


    function checkTitleReady(){

        //TODO make maxlength config dependant
        if(titleElement.value.length >= 1 && titleElement.value.length <= 50) {
            title = titleElement.value;
            document.getElementById("mediaDisplayText").textContent = title;
        }
        else{
            //TODO error'
            title = null;
        }
        checkAll();
    }


    function checkGenreReady(){

        //TODO make maxlength config dependant
        if(genreElement.value.length >= 1 && genreElement.value.length <= 50) {
            genre = genreElement.value;
        }
        else{
            //TODO error'
            genre = null;
        }
        checkAll();
    }


    function checkAll(){
        if(imageFile != null && title != null && genre != null){
            submitButtonElement.disabled = false;
        }
        else{
            submitButtonElement.disabled = true;
        }
    }


    // ----------------------------------------- upload series -----------------------------------------

    async function submitSeries() {

        imageElement.disabled = true;
        titleElement.disabled = true;
        genreElement.disabled = true;

        let image = await fileToByteArray(imageFile);
        let encodedImage = image.toBase64();

        let data = {title: title, genre: genre, image: encodedImage};

        const response = await fetch("/upload/series", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if(response.ok){
            window.location.href = "/uploadSeason?q=" + await response.text();
        }
        else{
            imageElement.disabled = false;
            titleElement.disabled = false;
            genreElement.disabled = false;
        }
    }


    // -------------------------------------------- helpers --------------------------------------------

    function fileToByteArray(file) {
        return new Promise((resolve, reject) => {
            var reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onloadend = function (evt) {
                if (evt.target.readyState === FileReader.DONE) {
                    var arrayBuffer = evt.target.result;
                    var uint8Array = new Uint8Array(arrayBuffer);
                    resolve(uint8Array); // Return Uint8Array, not Array.from()
                }
            };

            reader.onerror = function (evt) {
                reject(evt.target.error);
            };
        });
    }

    function imageBytesToURL(bytes){
        let imgBlob = new Blob([bytes], { type: 'image/jpeg'});
        return URL.createObjectURL(imgBlob);
    }


</script>
</html>
